name: CI

# Her push ve pull request'te backend (pytest) + frontend (vitest) testlerini çalıştırır.
# Test DB'si SIFIRDAN `alembic upgrade head` ile kurulur — migration zinciri artık prod
# şemasıyla birebir (cols/idx/con/defaults). Migration'ların eklediği örnek/seed veri
# reset_data.sql ile temizlenir; ardından referans RBAC verisi (02_seed.sql) + admin
# kullanıcısı (seed_admin.py) yüklenir.
# Not: Migration zinciri ile prod arasındaki eski içerik farkları giderildiğinden artık
# ayrı bir şema dump'ına (01_schema.sql) gerek yoktur (bkz. tests/ci/README.md).

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # QUAL-001 (v4 denetim, Boyut 2): lint/tip kapısı. Hata durumunda job KIRMIZI.
    name: Lint & tip (ruff + svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend: ruff (kritik hata kapısı) ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: ruff'ı yükle (sürüm sabit — yerel = CI)
        run: pip install ruff==0.8.6

      - name: ruff — kritik hata kuralları (bloklayıcı)
        working-directory: backend
        # BİLEREK DAR küme: yalnız gerçek-hata sınıfları → bugün 0 ihlal, yani
        # kapı YEŞİL açılır ve yeni bir gerçek hatada (sözdizimi/tanımsız ad/
        # geçersiz karşılaştırma) anında KIRMIZI olur. Stil kuralları (I/F401 vb.)
        # backend/ruff.toml'da yerel-danışma olarak tam açık; temizlendikçe bu
        # bloklayıcı listeye taşınır (kademeli sıkılaştırma).
        # E9=sözdizimi · F63=geçersiz karşılaştırma/assert tuzağı · F7=yanlış
        # yerde break/return · F82=tanımsız ad.
        run: ruff check . --select E9,F63,F7,F82

      # --- Frontend: svelte-check (tip denetimi) ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Node bağımlılıklarını yükle
        working-directory: frontend
        run: npm ci

      - name: svelte-kit sync (tip üretimi — svelte-check ön koşulu)
        working-directory: frontend
        # .svelte-kit/tsconfig.json'u üretir; olmadan svelte-check "cannot read
        # file" ile ölür (bloklayıcı kapıda yanlış-kırmızı olurdu).
        run: npx svelte-kit sync

      - name: svelte-check (tip denetimi — bloklayıcı, threshold=error)
        working-directory: frontend
        run: npm run check

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sprenses
          POSTGRES_PASSWORD: sprenses_ci
          POSTGRES_DB: sprenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprenses"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sprenses:sprenses_ci@localhost:5432/sprenses_test
      SECRET_KEY: ci-secret-key-for-tests-minimum-32-characters-long
      INTERNAL_SECRET: ci-internal-secret-for-tests-minimum-32-characters
      CORS_ORIGINS: http://testserver
      PGPASSWORD: sprenses_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python bağımlılıklarını yükle
        run: pip install -r requirements.txt

      - name: Test veritabanını kur (alembic şema + referans veri + admin)
        run: |
          alembic upgrade head
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/ci/reset_data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/ci/02_seed.sql
          PYTHONPATH=. python tests/ci/seed_admin.py

      - name: pytest (+ kapsam eşiği)
        # Satır kapsamı %60 altına düşerse CI kırmızı (yerel ölçüm: %66). Regresyonu görünür kılar.
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Node bağımlılıklarını yükle
        run: npm ci

      - name: vitest
        run: npx vitest run
